<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Résonance · Page introuvable</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13100e">
<meta http-equiv="refresh" content="8; url=/">
<link rel="icon" type="image/png" href="/icons/favicon-48.png">
<link rel="preload" href="/fonts/unbounded-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Servie par GitHub Pages pour toute adresse inconnue : chemins absolus obligatoires. */
  @font-face { font-family: 'Unbounded'; font-weight: 900; font-display: swap; src: url('/fonts/unbounded-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap; src: url('/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
  :root { --ink: #13100e; --bone: #efe3cf; --saffron: #f2a541; --dust: #8a7d6c; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--ink); }
  body { display: grid; place-items: center; text-align: center; color: var(--bone); font: 15px/1.6 'IBM Plex Mono', ui-monospace, Menlo, monospace; overflow: hidden; }
  main { position: relative; padding: 24px 16px; max-width: 420px; }
  .ondes { position: relative; width: 160px; height: 90px; margin: 0 auto 22px; }
  .ondes i { position: absolute; top: 45px; width: 0; height: 0; border-radius: 50%; border: 2px solid var(--dust); animation: onde 3.2s ease-out infinite; opacity: 0; }
  .ondes i:nth-child(1) { left: 40px; } .ondes i:nth-child(2) { left: 120px; border-color: var(--saffron); animation-delay: 1.6s; }
  @keyframes onde { from { width: 0; height: 0; margin: 0; opacity: .9; } to { width: 120px; height: 120px; margin: -60px; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ondes i { animation: none; opacity: .6; width: 60px; height: 60px; margin: -30px; } }
  h1 { font: 900 clamp(34px, 10vw, 48px)/1 'Unbounded', 'Arial Black', sans-serif; letter-spacing: -.02em; margin: 0 0 14px; }
  h1 em { font-style: normal; color: var(--saffron); }
  p { margin: 0 0 6px; }
  .en { color: var(--dust); font-size: 13px; }
  a.btn { display: inline-block; margin-top: 24px; padding: 14px 26px; border-radius: 999px; background: var(--saffron); color: var(--ink);
    font: 700 14px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
  a.btn:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
  .auto { margin-top: 16px; color: var(--dust); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="ondes" aria-hidden="true"><i></i><i></i></div>
  <h1>Aucun <em>écho</em></h1>
  <p>Les ondes ne se croisent pas ici : cette page n'existe pas.</p>
  <p class="en" lang="en">No echo here: this page doesn't exist.</p>
  <a class="btn" href="/">Retour au jeu</a>
  <p class="auto">Retour automatique dans quelques secondes.</p>
</main>
</body>
</html>
