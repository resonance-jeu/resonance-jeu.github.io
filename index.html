<style>
/* Layout: plein écran, canvas sous un HUD fin ; palettes à débloquer, « Seiche » par défaut. */
:root{
  --ink:#13100e; --bone:#efe3cf; --saffron:#f2a541; --rose:#d9776b; --dust:#8a7d6c; --p2:#6fc2c0;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit}
.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;pointer-events:none;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.hud b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:0;color:var(--bone);
  font-variant-numeric:tabular-nums;text-transform:none;white-space:nowrap}
.hud .l{display:flex;align-items:center;gap:12px;min-width:0}
.hud .r{text-align:right}
.menubtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--bone) 35%,transparent);
  background:transparent;color:var(--bone);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.menubtn:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.menubtn svg{width:16px;height:16px}
.pulses{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:40vw}
.pulses i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;display:block;color:var(--bone)}
.pulses i.on{background:currentColor}
.pulses .inf{font-family:var(--f-display);font-size:20px;color:var(--bone);letter-spacing:0}
.duel{position:fixed;left:0;right:0;padding:0 16px;display:flex;align-items:center;gap:12px;pointer-events:none;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.duel b{font-family:var(--f-display);font-size:18px;letter-spacing:0;font-variant-numeric:tabular-nums}
.duel .pulses{justify-content:flex-start;max-width:none;flex:1}
.duel.bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.duel.top{top:0;padding-bottom:calc(env(safe-area-inset-top,0px) + 14px);transform:rotate(180deg)}
.duel.bot b,.duel.bot .pulses i{color:var(--saffron)}
.duel.top b,.duel.top .pulses i{color:var(--p2)}
.freezebtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;
  padding:10px 14px;border-radius:999px;border:1.5px solid var(--p2);background:transparent;color:var(--p2);cursor:pointer}
.freezebtn b{font-family:var(--f-display);margin-left:4px}
.freezebtn.armed{background:var(--p2);color:var(--ink)}
.tip{position:fixed;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;
  font-family:var(--f-mono);font-size:13px;line-height:1.5;color:var(--dust);pointer-events:none;
  max-width:36ch;margin:0 auto;transition:opacity .6s}
.tip.mid{bottom:auto;top:50%;transform:translateY(-50%)}
.tip.high{bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
.tip.strong{color:var(--bone)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translate(-50%,-12px);opacity:0;
  background:var(--saffron);color:var(--ink);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;padding:8px 14px;border-radius:999px;
  pointer-events:none;transition:opacity .3s, transform .3s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);gap:16px;overflow-y:auto;
  background:linear-gradient(to top, color-mix(in srgb,var(--ink) 97%,transparent) 60%, color-mix(in srgb,var(--ink) 60%,transparent) 85%, transparent)}
.overlay.solid{background:var(--ink)}
.overlay > :first-child{margin-top:auto}
.overlay h1{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,15vw,92px);line-height:.9;margin:0;letter-spacing:-.03em;text-wrap:balance}
.overlay h1 em{font-style:normal;color:var(--saffron)}
.overlay h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:8px 0 0}
.overlay .kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--saffron)}
.overlay p{font-family:var(--f-mono);font-size:14px;line-height:1.6;color:var(--bone);margin:0;max-width:38ch;opacity:.85}
.rules{font-family:var(--f-mono);font-size:13px;line-height:1.55;color:var(--bone);opacity:.8;max-width:40ch;margin:0}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%;max-width:620px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;min-width:0;
  padding:11px 14px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--bone) 25%,transparent);background:transparent;color:var(--bone)}
.mode strong{font-family:var(--f-display);font-weight:700;font-size:14px}
.mode small{font-family:var(--f-mono);font-size:11px;color:var(--dust);letter-spacing:.04em}
.mode small b{color:var(--bone);font-weight:500;font-variant-numeric:tabular-nums}
.mode.primary{background:var(--saffron);border-color:var(--saffron);color:var(--ink)}
.mode.primary small,.mode.primary small b{color:var(--ink)}
.mode:focus-visible,.btn:focus-visible,.sw:focus-visible,.tool:focus-visible,.linkbtn:focus-visible,.seg button:focus-visible,.cell:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
.themes{display:flex;flex-direction:column;gap:8px;width:100%;max-width:620px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:2px;color:var(--dust);
  font-family:var(--f-mono);font-size:10px;letter-spacing:.06em}
.sw span{width:40px;height:40px;border-radius:50%;display:block;border:2px solid transparent}
.sw.sel span{border-color:var(--bone)}
.sw.locked span{opacity:.35}
.sw.locked{cursor:default}
.links{display:flex;gap:18px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--bone);font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.btn{font-family:var(--f-display);font-weight:700;font-size:15px;padding:14px 24px;min-height:48px;border:0;border-radius:999px;background:var(--saffron);color:var(--ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--bone);border:1.5px solid var(--bone)}
.btn.small{font-size:13px;padding:10px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
#dailyLine{color:var(--bone);opacity:.82}
.flame{display:inline-flex;align-items:center;gap:3px;margin-left:8px;color:var(--saffron);font-weight:500;font-variant-numeric:tabular-nums}
.flame svg{width:9px;height:12px;fill:currentColor;transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86) skewX(-4deg)}}
.share-prev{width:100%;max-width:420px;box-sizing:border-box;margin:0;padding:12px 16px;border-radius:12px;
  background:color-mix(in srgb,var(--bone) 6%,var(--ink));border-left:3px solid var(--saffron);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rose) 22%,transparent)}
.share-prev pre{margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.55;color:var(--bone);white-space:pre-wrap;word-break:break-word}
.end-extra{white-space:pre-line}
.end-extra .flame{margin:0 6px 0 0}
.sr-status{font-family:var(--f-mono);font-size:12px;color:var(--saffron);min-height:1em;margin:0}
.share-lbl{font-family:var(--f-mono);font-size:12px;color:var(--bone)}
.share{width:100%;max-width:420px;min-height:130px;font-family:var(--f-mono);font-size:13px;line-height:1.5;box-sizing:border-box;
  background:color-mix(in srgb,var(--bone) 8%,var(--ink));color:var(--bone);border:1px solid color-mix(in srgb,var(--bone) 25%,transparent);
  border-radius:12px;padding:12px;resize:none;-webkit-user-select:text;user-select:text;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 16px;width:100%;max-width:620px}
.stats div{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust)}
.stats b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:0;color:var(--bone);font-variant-numeric:tabular-nums}
.ach{display:grid;gap:6px;width:100%;max-width:620px;margin:0;padding:0;list-style:none}
.ach li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-family:var(--f-mono);font-size:13px;line-height:1.4;color:var(--dust)}
.ach li i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--dust);margin-top:2px;font-style:normal}
.ach li.on{color:var(--bone)}
.ach li.on i{background:var(--saffron);border-color:var(--saffron)}
.ach li span b{font-weight:500;color:inherit}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;max-width:520px;flex-wrap:wrap;
  padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--bone) 12%,transparent)}
.setrow > div{font-family:var(--f-mono);font-size:14px;color:var(--bone);min-width:0}
.setrow small{display:block;font-size:11.5px;color:var(--dust);margin-top:2px;max-width:34ch}
.seg{display:flex;border:1.5px solid color-mix(in srgb,var(--bone) 30%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--bone);font-family:var(--f-mono);font-size:12px;padding:8px 12px;cursor:pointer}
.seg button.on{background:var(--bone);color:var(--ink)}
.world{width:100%;max-width:620px;display:grid;gap:8px;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--bone) 12%,transparent)}
.world h3{margin:0;font-family:var(--f-display);font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.world h3 span{font-family:var(--f-mono);font-size:12px;color:var(--dust);font-weight:400}
.world p{font-size:12.5px;margin:0;color:var(--dust);opacity:1}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1.15;max-width:100%;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--bone) 25%,transparent);background:transparent;
  color:var(--bone);font-family:var(--f-display);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.cell small{font-family:var(--f-mono);font-size:10px;color:var(--saffron);letter-spacing:.05em}
.cell.boss{border-color:var(--rose);color:var(--rose)}
.cell.locked{opacity:.3;cursor:default}
.cell.done{border-color:var(--saffron)}
.world.locked{opacity:.45}
.edtools{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;overflow-x:auto;
  background:color-mix(in srgb,var(--ink) 92%,transparent);border-top:1px solid color-mix(in srgb,var(--bone) 15%,transparent)}
.tool{flex:none;font-family:var(--f-mono);font-size:12px;padding:9px 12px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--bone) 30%,transparent);
  background:transparent;color:var(--bone);cursor:pointer;white-space:nowrap}
.tool.sel{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.edtop{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.edtop .grow{flex:1;min-width:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust)}
.edtop .grow b{display:block;font-family:var(--f-display);font-size:16px;letter-spacing:0;color:var(--bone);text-transform:none}
.stepper{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--bone)}
.stepper button{width:30px;height:30px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--bone) 30%,transparent);background:transparent;color:var(--bone);cursor:pointer;padding:0}
.banner{position:fixed;left:16px;right:16px;top:42%;text-align:center;font-family:var(--f-display);font-weight:900;
  font-size:clamp(30px,10vw,56px);color:var(--saffron);pointer-events:none;letter-spacing:-.02em;opacity:0;transform:scale(.9);transition:opacity .35s, transform .35s}
.banner.show{opacity:1;transform:scale(1)}
.banner small{display:block;font-family:var(--f-mono);font-weight:400;font-size:13px;letter-spacing:.14em;color:var(--bone);text-transform:uppercase;margin-top:8px}
.fade{position:fixed;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.fade.on{opacity:1}
.splash{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:50;transition:opacity .5s;cursor:pointer}
.splash.hide{opacity:0;pointer-events:none}
.sp-stage{position:relative;width:min(70vw,320px);aspect-ratio:1;display:grid;place-items:center}
.sp-stage i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--bone);opacity:0;animation:sp 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.sp-stage i:nth-child(2){animation-delay:.6s;border-color:var(--saffron)}
.sp-stage i:nth-child(3){animation-delay:1.2s;border-color:var(--rose)}
.sp-title{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,11vw,60px);letter-spacing:-.03em;position:relative}
.sp-title em{font-style:normal;color:var(--saffron)}
@keyframes sp{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion: reduce){ .banner,.tip,.toast,.fade,.splash{transition:none} .sp-stage i{animation:none;opacity:.4} .flame svg{animation:none} }
.seg.wrap{flex-wrap:wrap;border-radius:16px}
.seg.wrap button{flex:1 0 auto}
</style>

<canvas id="c" data-ia="a_canvas"></canvas>

<div class="hud" id="hud" hidden>

<script src="defi.js"></script>
<script>
/*ENGINE*/
const TAU=Math.PI*2, K_MUD=2.2, ANG=0.6;
const angDiff=(a,b)=>{ let d=Math.abs(a-b)%TAU; return d>Math.PI?TAU-d:d; };
const E = {
  pos(G,o){ return { x:G.env.x0+o.nx*G.env.w, y:G.env.y0+o.ny*G.env.h }; },
  mkTarget(t){
    return { nx:t.nx, ny:t.ny, need:t.need||2, twin:(t.twin==null?null:t.twin), fragile:!!t.fragile, vx:t.vx||0, vy:t.vy||0,
      freq:t.freq||null, battery:!!t.battery, decay:t.decay||0, seq:(t.seq==null?null:t.seq), chroma:!!t.chroma, coop:!!t.coop, boss:!!t.boss,
      hits:[], lit:false, litT:0, depth:0, owner:0, dirs:0, armedT:null, frozenUntil:0 };
  },
  layout(G){
    for(const w of G.walls){ const c=E.pos(G,w), h=w.len*G.env.U/2; w.e=[c.x-Math.cos(w.a)*h,c.y-Math.sin(w.a)*h,c.x+Math.cos(w.a)*h,c.y+Math.sin(w.a)*h]; }
    for(const m of [...G.muds,...G.jammers,...G.currents]){ const c=E.pos(G,m); m.x=c.x; m.y=c.y; m.rr=m.r*G.env.U; }
    for(const o of [...G.prisms,...G.gates,...G.targets,...G.delays,...G.beacons]){ const c=E.pos(G,o); o.x=c.x; o.y=c.y; }
  },
  create(L, env, speed, win){
    const gates=[];
    for(const p of (L.portals||[])){ const a={nx:p.a.nx,ny:p.a.ny,lastT:-9}, b={nx:p.b.nx,ny:p.b.ny,lastT:-9}; a.mate=b; b.mate=a; gates.push(a,b); }
    const G={ env, speed, win, t:0, stepN:0, rings:[], gates, pending:[],
      targets:L.targets.map(E.mkTarget),
      walls:(L.walls||[]).map(w=>({ nx:w.nx, ny:w.ny, a:w.a, len:w.len, mirror:!!w.mirror })),
      prisms:(L.prisms||[]).map(p=>({ nx:p.nx, ny:p.ny, lastT:-9, hue:(p.hue==null?null:p.hue) })),
      muds:(L.muds||[]).map(m=>({ nx:m.nx, ny:m.ny, r:m.r })),
      jammers:(L.jammers||[]).map(j=>({ nx:j.nx, ny:j.ny, r:j.r, vx:j.vx||0, vy:j.vy||0 })),
      currents:(L.currents||[]).map(c=>({ nx:c.nx, ny:c.ny, r:c.r, vx:c.vx, vy:c.vy })),
      delays:(L.delays||[]).map(d=>({ nx:d.nx, ny:d.ny, lastT:-9 })),
      beacons:(L.beacons||[]).map(b=>({ nx:b.nx, ny:b.ny, active:false, next:0, period:b.period||0.7, owner:0 })) };
    G.drift = G.targets.some(t=>t.vx||t.vy) || G.jammers.length>0 || G.currents.length>0;
    G.hasFreq = G.targets.some(t=>t.freq);
    E.layout(G); return G;
  },
  addTarget(G,t){ const o=E.mkTarget(t), c=E.pos(G,o); o.x=c.x; o.y=c.y; G.targets.push(o); return o; },
  inter(ax,ay,bx,by,cx,cy,dx,dy){
    const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx); if(Math.abs(d)<1e-9) return null;
    const u=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d, v=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d;
    return (u>1e-3&&u<1-1e-3&&v>=0&&v<=1) ? { x:ax+u*(bx-ax), y:ay+u*(by-ay) } : null;
  },
  blocked(G,ax,ay,bx,by,except){
    for(const w of G.walls){ if(w===except) continue; const e=w.e; if(E.inter(ax,ay,bx,by,e[0],e[1],e[2],e[3])) return true; }
    return false;
  },
  segCirc(ax,ay,bx,by,cx,cy,r){
    const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; const k=L2?Math.max(0,Math.min(1,((cx-ax)*dx+(cy-ay)*dy)/L2)):0;
    return Math.hypot(ax+k*dx-cx, ay+k*dy-cy) < r;
  },
  mudOverlap(G,ox,oy,px,py){
    const dx=px-ox, dy=py-oy, d=Math.hypot(dx,dy); if(!d) return 0;
    const ux=dx/d, uy=dy/d; let s=0;
    for(const m of G.muds){
      const fx=ox-m.x, fy=oy-m.y, b=fx*ux+fy*uy, c=fx*fx+fy*fy-m.rr*m.rr, disc=b*b-c;
      if(disc<=0) continue; const q=Math.sqrt(disc);
      const t1=Math.max(-b-q,0), t2=Math.min(-b+q,d); if(t2>t1) s+=t2-t1;
    }
    return s;
  },
  eff(G,r,px,py){
    const d=Math.hypot(px-r.x,py-r.y);
    return (r.via||!G.muds.length) ? d : d+(K_MUD-1)*E.mudOverlap(G,r.x,r.y,px,py);
  },
  reach(G,r,px,py){
    let ax=r.x, ay=r.y;
    if(r.via){
      const e=r.via.e, X=E.inter(r.x,r.y,px,py,e[0],e[1],e[2],e[3]);
      if(!X || E.blocked(G,X.x,X.y,px,py,r.via)) return false; ax=X.x; ay=X.y;
    } else if(E.blocked(G,ax,ay,px,py,null)) return false;
    for(const j of G.jammers) if(E.segCirc(ax,ay,px,py,j.x,j.y,j.rr)) return false;
    return true;
  },
  ring(G,x,y,kind,src,depth,owner,freq,portaled,ex){
    ex=ex||{};
    const mk=(x,y,via)=>({ x, y, r:0, kind, src, depth, owner, freq:freq||null, portaled:!!portaled, via, trig:new Set(),
      hue:(ex.hue==null?null:ex.hue), tag:ex.tag||null, freeze:!!ex.freeze, delayed:!!ex.delayed });
    const out=[mk(x,y,null)];
    for(const w of G.walls){
      if(!w.mirror) continue;
      const [ax,ay,bx,by]=w.e, dx=bx-ax, dy=by-ay, t=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy);
      const px=ax+t*dx, py=ay+t*dy; if(Math.hypot(x-px,y-py)<2) continue;
      out.push(mk(2*px-x, 2*py-y, w));
    }
    const extra = 0.25*G.env.U + (G.drift?0.35*G.env.U:0);
    for(const r of out){
      let m=0;
      for(const o of G.targets) m=Math.max(m,E.eff(G,r,o.x,o.y));
      for(const o of G.prisms) m=Math.max(m,E.eff(G,r,o.x,o.y));
      for(const o of G.gates) m=Math.max(m,E.eff(G,r,o.x,o.y));
      for(const o of G.delays) m=Math.max(m,E.eff(G,r,o.x,o.y));
      r.lim=m+extra;
    }
    return out;
  },
  tap(G,x,y,owner,freq,ex){ G.rings.push(...E.ring(G,x,y,'tap',null,0,owner||0,freq||null,false,ex)); },
  active(G){ return G.rings.some(r=>r.r<=r.lim) || G.pending.length>0 || G.beacons.some(b=>b.active) || G.targets.some(t=>t.armedT!=null&&!t.lit); },
  allLit(G){ return G.targets.every(t=>t.lit); },
  ready(t){
    if(t.dirs<t.need) return false;
    if(t.chroma){ const s=new Set(); for(const h of t.hits) if(h.hue!=null) s.add(h.hue); if(s.size<2) return false; }
    if(t.coop){ const s=new Set(t.hits.map(h=>h.owner)); if(!s.has(1)||!s.has(2)) return false; }
    return true;
  },
  hitInfo(hs){
    let depth=0; const cnt={};
    for(const h of hs){ depth=Math.max(depth,h.depth); if(h.owner) cnt[h.owner]=(cnt[h.owner]||0)+1; }
    let owner=0, best=-1;
    for(const k in cnt){ if(cnt[k]>best){ best=cnt[k]; owner=+k; } else if(cnt[k]===best){ owner=hs[hs.length-1].owner; } }
    return { depth, owner };
  },
  light(G,t,born,ev){
    const info=E.hitInfo(t.hits);
    const depth=Math.max(info.depth, t.armedT!=null?(t.armDepth||0):0)+1;
    t.byVia=t.hits.some(h=>h.via); t.byPortal=t.hits.some(h=>h.portal); t.onBeat=t.hits.some(h=>h.tag==='beat');
    const dh=t.hits.filter(h=>h.direct);
    t.spread=dh.length>1 ? Math.max(...dh.map(h=>h.t))-Math.min(...dh.map(h=>h.t)) : null;
    t.lit=true; t.litT=G.t; t.depth=depth; t.owner=info.owner||t.armOwner||0; t.armedT=null; t.hits=[];
    born.push(...E.ring(G,t.x,t.y,'chain',t,depth,t.owner,t.freq,false,{}));
    ev('light',t);
  },
  step(G,dt,ev){
    G.t+=dt; G.stepN++;
    const moved=new Set();
    for(const o of [...G.targets,...G.jammers]){
      if(!(o.vx||o.vy) || (o.frozenUntil && G.t<o.frozenUntil)) continue;
      o.nx+=o.vx*dt; o.ny+=o.vy*dt;
      if(o.nx<0.03||o.nx>0.97){ o.vx*=-1; o.nx=Math.min(Math.max(o.nx,0.03),0.97); }
      if(o.ny<0.03||o.ny>0.97){ o.vy*=-1; o.ny=Math.min(Math.max(o.ny,0.03),0.97); }
      moved.add(o);
    }
    if(G.currents.length) for(const t of G.targets){
      if(t.frozenUntil && G.t<t.frozenUntil) continue;
      for(const c of G.currents) if(Math.hypot(t.x-c.x,t.y-c.y)<c.rr){
        t.nx=Math.min(Math.max(t.nx+c.vx*dt,0.03),0.97); t.ny=Math.min(Math.max(t.ny+c.vy*dt,0.03),0.97); moved.add(t); }
    }
    for(const o of moved){ const c=E.pos(G,o); o.x=c.x; o.y=c.y; }
    const born=[];
    for(const b of G.beacons) if(b.active && G.t>=b.next){ b.next=G.t+b.period; born.push(...E.ring(G,b.x,b.y,'beacon',null,0,b.owner,null,false,{})); ev('beacon',b); }
    if(G.pending.length){
      const due=G.pending.filter(p=>p.t<=G.t);
      if(due.length){ G.pending=G.pending.filter(p=>p.t>G.t); for(const p of due){ born.push(...E.ring(G,...p.a)); ev('echo',p); } }
    }
    for(const r of G.rings){
      const prev=r.r; r.r+=G.speed*dt;
      if(prev>r.lim) continue;
      for(const t of G.targets){
        if(t===r.src) continue;
        if(r.freeze){
          if(!t.lit && (t.vx||t.vy||G.currents.length)){ const e=E.eff(G,r,t.x,t.y); if(prev<e&&e<=r.r&&E.reach(G,r,t.x,t.y)){ t.frozenUntil=G.t+3; ev('freeze',t); } }
          continue;
        }
        if(t.lit&&!t.fragile) continue;
        if(t.freq && r.freq && r.freq!==t.freq) continue;
        const e=E.eff(G,r,t.x,t.y);
        if(prev<e && e<=r.r && E.reach(G,r,t.x,t.y))
          t.hits.push({ t:G.t, a:Math.atan2(r.y-t.y,r.x-t.x), depth:r.depth, kind:r.kind, owner:r.owner,
            direct:r.kind==='tap'&&!r.via&&!r.portaled, via:!!r.via, portal:r.portaled, hue:r.hue, tag:r.tag });
      }
      if(r.freeze) continue;
      const ex={ hue:r.hue, tag:r.tag, delayed:r.delayed };
      if(r.kind!=='prism') for(const p of G.prisms){
        if(r.trig.has(p)) continue;
        const e=E.eff(G,r,p.x,p.y);
        if(prev<e && e<=r.r && E.reach(G,r,p.x,p.y) && G.t-p.lastT>0.15){
          r.trig.add(p); p.lastT=G.t;
          born.push(...E.ring(G,p.x,p.y,'prism',p,r.depth,r.owner,r.freq,r.portaled,{...ex, hue:(p.hue!=null?p.hue:r.hue)})); ev('prism',p);
        }
      }
      if(!r.portaled) for(const g of G.gates){
        if(r.trig.has(g)) continue;
        const e=E.eff(G,r,g.x,g.y);
        if(prev<e && e<=r.r && E.reach(G,r,g.x,g.y) && G.t-g.lastT>0.15){
          r.trig.add(g); g.lastT=g.mate.lastT=G.t;
          born.push(...E.ring(G,g.mate.x,g.mate.y,r.kind,r.src,r.depth,r.owner,r.freq,true,ex)); ev('portal',g);
        }
      }
      if(!r.delayed) for(const d of G.delays){
        if(r.trig.has(d)) continue;
        const e=E.eff(G,r,d.x,d.y);
        if(prev<e && e<=r.r && E.reach(G,r,d.x,d.y) && G.t-d.lastT>0.15){
          r.trig.add(d); d.lastT=G.t;
          G.pending.push({ t:G.t+1, d, a:[d.x,d.y,'delay',d,r.depth,r.owner,r.freq,r.portaled,{...ex, delayed:true}] }); ev('delay',d);
        }
      }
    }
    for(const t of G.targets){
      if(t.lit && t.decay && G.t-t.litT>t.decay){ t.lit=false; t.hits=[]; t.armedT=null; ev('fade',t); continue; }
      if(!t.lit){
        t.hits=t.hits.filter(h=>G.t-h.t<=G.win);
        const dirs=[]; for(const h of t.hits) if(dirs.every(a=>angDiff(a,h.a)>ANG)) dirs.push(h.a);
        t.dirs=dirs.length;
        if(E.ready(t)){
          if(t.twin==null) E.light(G,t,born,ev);
          else{
            if(t.armedT==null){ const i=E.hitInfo(t.hits); t.armedT=G.t; t.armDepth=i.depth; t.armOwner=i.owner; ev('arm',t); }
            const tw=G.targets[t.twin];
            if(tw && !tw.lit && tw.armedT!=null){ E.light(G,t,born,ev); E.light(G,tw,born,ev); }
          }
        }
        if(!t.lit && t.armedT!=null && G.t-t.armedT>G.win) t.armedT=null;
      } else if(t.fragile){
        for(const h of t.hits){
          if(h.done || !h.direct || G.t-h.t<=G.win) continue;
          h.done=true;
          if(!t.hits.some(o=>o!==h && Math.abs(o.t-h.t)<=G.win && angDiff(o.a,h.a)>ANG)){
            t.lit=false; t.hits=[]; t.armedT=null; ev('break',t); break;
          }
        }
        t.hits=t.hits.filter(h=>G.t-h.t<=2*G.win);
      }
    }
    G.rings.push(...born);
  }
};

  toast(t('ach_toast',{n:achText(id)[0]}),2600);
  tone(SCALE[8],0.4,'triangle',0.04); tone(SCALE[10],0.5,'triangle',0.03,0.08);
}

/* ---------- état ---------- */
let G=null;
const S={ mode:'arcade', level:1, score:0, levelStartScore:0, pulses:0, max:0, pp:[0,0,0], ppMax:0,
  phase:'menu', clearT:0, acc:0, marks:[], timeLeft:0, grids:0, fails:0, zenLit:0, levelDepth:0,
  tapLog:[], dailyRuns:[], dailyStats:[], dailyRetries:0, replay:null, layout:null,
  survT:0, spawnT:0, expect:0, melodyFails:0, custom:null, hold:null, bhold:null,
  freezes:0, freezeArmed:false, camp:null, tutoTaps:0, rh:null };
const seen=new Set();

const SQUARE=['puzzle','editor','custom','tuto'];
const FIXED=['puzzle','daily','replay','camp','tuto','custom','editor'];
const SPLIT=['duel','coop'];
function square(){ return SQUARE.includes(S.mode); }
function makeEnv(){
  if(square()){
    const top = S.mode==='editor' ? 110 : TOP, bot = S.mode==='editor' ? 80 : (S.mode==='tuto'?120:BOT);
    const side=Math.min(W-32, H-top-bot-24);
    return { x0:(W-side)/2, y0:top+(H-top-bot-side)/2, w:side, h:side, U:side };
  }
  return { x0:28, y0:TOP, w:W-56, h:H-TOP-BOT, U:M };
}
const speedFor=env=> (square() ? env.U*0.42 : Math.max(env.U*0.42,160)) * (FIXED.includes(S.mode)?1:SET.speed);
const nodeR=()=>Math.max(13,(G?G.env.U:M)*0.032);

/* ---------- génération de grilles ---------- */
function featuresFor(L,o){
  const off={ n:4, walls:0, mirror:false, prisms:0, mud:0, twins:false, fragile:false, battery:false, freq:false, decay:false, portal:false,
    jam:false, drift:false, triples:0, currents:0, chroma:false, delay:false, beacon:false, boss:false, freeze:false, speedL:10 };
  if(o.F) return Object.assign(off,o.F);
  const wantPortal = L>=12 && (L%2===0 || L>=16);
  return Object.assign(off,{ n:o.n||Math.min(3+Math.floor((L-1)/2),10),
    walls:o.noWalls?0:(L>=3?Math.min(1+Math.floor((L-3)/2),4):0), mirror:L>=6&&!wantPortal, prisms:L>=5?(L>=8?2:1):0,
    mud:o.noMud?0:(L>=11?2:(L>=7?1:0)), twins:L>=8&&!o.noTwins, fragile:L>=9&&!o.noFragile, battery:L>=4&&!o.noBattery,
    freq:L>=13&&!o.noFreq, decay:L>=15&&!o.noDecay, portal:wantPortal&&!o.noPortal, jam:L>=14&&!o.noJam, drift:L>=6&&!o.noDrift,
    triples:L>=4?Math.min(0.15+L*0.02,0.4):0, currents:(L>=16&&!o.noCurrents)?1:0, chroma:L>=17&&!o.noChroma, delay:L>=18&&!o.noDelay,
    beacon:L>=19&&!o.noBeacon, freeze:L>=16&&!o.noFreeze, speedL:L });
}
function genLevel(L,rng,o={}){
  const F=featuresFor(L,o);
  const env=makeEnv(), R=Math.max(13,env.U*0.032), rand=(a,b)=>a+rng()*(b-a);
  const P=q=>({x:env.x0+q.nx*env.w, y:env.y0+q.ny*env.h});
  const dist=(a,b)=>{ const p=P(a), q=P(b); return Math.hypot(p.x-q.x,p.y-q.y); };
  const T=[]; let tries=0;
  if(F.boss) T.push({nx:0.5,ny:0.5,need:4,boss:true});
  const n=F.n+(F.boss?1:0);
  while(T.length<n && tries<4000){ tries++;
    const nd={nx:rand(0.05,0.95),ny:rand(0.05,0.95),need:2};
    if(T.every(q=>dist(q,nd)>(q.boss?0.28:0.2)*env.U)) T.push(nd); }
  const free=()=>T.filter(x=>x.need===2&&!x.boss&&x.twin==null&&!x.fragile&&!x.battery&&!x.freq&&!x.decay&&!x.chroma);
  if(F.twins && T.length>=4){ const f=free(); if(f.length>=2){ f[0].twin=T.indexOf(f[1]); f[1].twin=T.indexOf(f[0]); } }
  if(F.fragile){ const f=free(); if(f.length) f[f.length-1].fragile=true; }
  if(F.battery && rng()<0.55){ const f=free(); if(f.length) f[0].battery=true; }
  if(F.freq){ const f=free(); const k=Math.floor(rng()*2); f.slice(0,Math.min(3,f.length)).forEach((x,i)=>x.freq=(i+k)%2?'low':'high'); }
  if(F.decay){ const f=free(); if(f.length) f[f.length-1].decay=6; }
  if(F.chroma){ const f=free(); f.slice(0,Math.min(2,f.length)).forEach(x=>x.chroma=true); }
  if(F.triples) free().forEach(x=>{ if(rng()<F.triples) x.need=3; });
  if(F.drift) T.forEach(x=>{ if(x.boss) return; const sp=Math.min(0.01+F.speedL*0.0012,0.026), a=rand(0,TAU); x.vx=Math.cos(a)*sp; x.vy=Math.sin(a)*sp; });
  const drift=T.some(x=>x.vx);
  const ends=w=>{ const c=P(w), h=w.len*env.U/2; return [c.x-Math.cos(w.a)*h,c.y-Math.sin(w.a)*h,c.x+Math.cos(w.a)*h,c.y+Math.sin(w.a)*h]; };
  const dSeg=(px,py,e)=>{ const [ax,ay,bx,by]=e, dx=bx-ax, dy=by-ay; const k=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy))); return Math.hypot(px-ax-k*dx,py-ay-k*dy); };
  const Wl=[]; tries=0;
  while(Wl.length<F.walls && tries<4000){ tries++;
    const w={nx:rand(0.1,0.9),ny:rand(0.1,0.9),a:rand(0,Math.PI),len:rand(0.22,0.34)}; const e=ends(w);
    if(Math.min(e[0],e[2])<20||Math.max(e[0],e[2])>W-20||Math.min(e[1],e[3])<TOP-10||Math.max(e[1],e[3])>H-BOT) continue;
    if(T.some(x=>{const p=P(x);return dSeg(p.x,p.y,e)<(drift?R*4.5:x.boss?R*4:R*2.8);})) continue;
    if(Wl.some(q=>dist(q,w)<0.25*env.U)) continue;
    Wl.push(w); }
  if(F.mirror && Wl.length) Wl[0].mirror=true;
  const okSpot=(q,rad)=>{ const c=P(q);
    if(T.some(x=>{const p=P(x);return Math.hypot(p.x-c.x,p.y-c.y)<rad+R*2+(drift?0.12*env.U:0);})) return false;
    if(Wl.some(w=>dSeg(c.x,c.y,ends(w))<rad+12)) return false; return true; };
  const Md=[]; tries=0;
  while(Md.length<F.mud && tries<4000){ tries++;
    const m={nx:rand(0.12,0.88),ny:rand(0.12,0.88),r:rand(0.09,0.12)};
    if(!okSpot(m,m.r*env.U)) continue;
    if(Md.some(q=>dist(q,m)<(q.r+m.r)*env.U+20)) continue; Md.push(m); }
  const spotFree=(p,minT=0.14)=>{
    if(T.some(x=>dist(x,p)<minT*env.U)) return false;
    if(Wl.some(w=>{const c=P(p);return dSeg(c.x,c.y,ends(w))<R*2.5;})) return false;
    if(Md.some(m=>dist(m,p)<m.r*env.U+R)) return false; return true; };
  const Pr=[]; const np=Math.max(F.prisms, F.chroma?2:0); tries=0;
  while(Pr.length<np && tries<4000){ tries++;
    const p={nx:rand(0.08,0.92),ny:rand(0.08,0.92)};
    if(!spotFree(p) || Pr.some(q=>dist(q,p)<0.25*env.U)) continue; Pr.push(p); }
  if(F.chroma) Pr.forEach((p,i)=>p.hue=i%2);
  const others=[...Pr];
  const Po=[]; if(F.portal){ tries=0;
    while(!Po.length && tries<4000){ tries++;
      const a={nx:rand(0.08,0.92),ny:rand(0.08,0.92)}, b={nx:rand(0.08,0.92),ny:rand(0.08,0.92)};
      if(dist(a,b)<0.45*env.U) continue;
      if(![a,b].every(q=>okSpot(q,R)&&spotFree(q)&&!others.some(p=>dist(p,q)<0.15*env.U))) continue;
      Po.push({a,b}); others.push(a,b); } }
  const place=(minD)=>{ for(let k=0;k<4000;k++){ const p={nx:rand(0.08,0.92),ny:rand(0.08,0.92)}; if(spotFree(p) && !others.some(q=>dist(q,p)<minD*env.U)){ others.push(p); return p; } } return null; };
  const Dl=[]; if(F.delay){ const p=place(0.18); if(p) Dl.push(p); }
  const Bc=[]; if(F.beacon){ const p=place(0.2); if(p) Bc.push({...p,period:0.7}); }
  const Jm=[]; if(F.jam){ const a=rand(0,TAU), sp=0.03; Jm.push({nx:rand(0.3,0.7),ny:rand(0.3,0.7),r:0.05,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp}); }
  const Cu=[]; for(let k=0;k<F.currents;k++){ const a=rand(0,TAU), sp=0.05; Cu.push({nx:rand(0.25,0.75),ny:rand(0.25,0.75),r:0.16,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp}); }
  return { targets:T, walls:Wl, prisms:Pr, muds:Md, portals:Po, jammers:Jm, currents:Cu, delays:Dl, beacons:Bc, freeze:F.freeze };
}
function budget(Ly){
  const T=Ly.targets;
  const base=T.length+1+T.filter(x=>x.need===3).length+(T.some(x=>x.boss)?2:0)+(T.some(x=>x.twin!=null)?1:0)
    +T.filter(x=>x.fragile||x.decay).length+((Ly.jammers||[]).length?1:0)+((Ly.currents||[]).length?1:0)+(T.some(x=>x.chroma)?1:0);
  const echo=(Ly.walls||[]).filter(w=>w.mirror).length*2+((Ly.portals||[]).length?2:0)+Math.max(0,(Ly.prisms||[]).length-1)+((Ly.delays||[]).length?1:0);
  return Math.max(Math.ceil(T.length*0.6)+1, base-echo);
}

/* ---------- niveaux ---------- */
function makeLevel(){
  const m=S.mode; let Ly;
  TOP = m==='duel' ? 70 : 90; BOT = 70;
  if(m==='puzzle') Ly=PUZZLES[S.level-1];
  else if(m==='custom') Ly=S.custom;
  else if(m==='tuto') Ly=JSON.parse(JSON.stringify(TUTO[S.level-1].L));
  else if(m==='camp'){ const {w,i}=S.camp; const F=WORLDS[w].F(i); if(i===9){ F.boss=true; F.n+=1; } Ly=genLevel(10,mulberry32(9000+w*100+i),{F}); }
  else if(m==='daily'||m==='replay') Ly=genLevel(DAILY_LEVELS[S.level-1], mulberry32(Defi.seed('resonance',(S.defi||TD).key,S.level)));
  else if(m==='zen') Ly=genLevel(3+(S.level%5), Math.random, {noDrift:true,noFragile:true,noDecay:true});
  else if(m==='chrono') Ly=genLevel(Math.min(3+S.grids,9), Math.random, {noDrift:true,noFragile:true,noTwins:true});
  else if(m==='duel') Ly=genLevel(7, Math.random, {n:9,noDrift:true,noFragile:true,noTwins:true,noMud:true,noBattery:true});
  else if(m==='coop'){ Ly=genLevel(S.level+1, Math.random, {noDrift:S.level<8,noFragile:true,noTwins:true,noFreq:true,noBeacon:true,noChroma:true}); Ly.targets.forEach(x=>x.coop=true); }
  else if(m==='surv') Ly=genLevel(5, Math.random, {n:3,noDrift:true,noFragile:true,noTwins:true,noMud:true,noBattery:true,noWalls:true});
  else if(m==='rhythm') Ly=genLevel(5, Math.random, {n:2,noDrift:true,noFragile:true,noTwins:true,noMud:true,noBattery:true,noWalls:true});
  else if(m==='melody'){
    const n=Math.min(3+S.level,8);
    Ly=genLevel(Math.min(2+S.level,9), Math.random, {n,noDrift:true,noFragile:true,noTwins:true,noBattery:true,noMud:true});
    const order=[...Ly.targets.keys()].sort(()=>Math.random()-0.5);
    const pent=[0,1,2,4,5,7,8,9]; let note=Math.floor(Math.random()*3);
    order.forEach((ti,k)=>{ const x=Ly.targets[ti]; x.seq=k; x.need=2; x.note=SCALE[pent[note]]; note=Math.max(0,Math.min(7,note+[-1,1,1,2,-2][Math.floor(Math.random()*5)])); });
  }
  else Ly=genLevel(S.level, Math.random);
  S.layout=Ly;
  const env=makeEnv();
  const win = m==='zen'?0.34 : ['puzzle','duel','chrono','surv','melody','custom','tuto','coop','rhythm','camp'].includes(m)?0.3 : Math.max(0.3-(effL()-1)*0.012,0.18);
  G=E.create(Ly, env, speedFor(env), win);
  if(m==='melody') G.targets.forEach((x,i)=>x.note=Ly.targets[i].note);
  S.acc=0; S.marks=[]; S.tapLog=[]; S.levelStartScore=S.score; S.expect=0; S.hold=null; S.bhold=null; S.tutoTaps=0; S.freezeArmed=false;
  S.freezes = Ly.freeze ? 2 : 0;
  if(m==='zen'||m==='chrono'){ S.max=S.pulses=Infinity; }
  else if(m==='rhythm'){ S.max=S.pulses=3; }
  else if(m==='tuto'){ S.max=S.pulses=TUTO[S.level-1].pulses||Infinity; }
  else if(m==='puzzle'){ S.max=S.pulses=1; }
  else if(m==='custom'){ S.max=S.pulses=Ly.pulses||budget(Ly); }
  else if(m==='surv'){ S.max=12; S.pulses=8; S.spawnT=0; }
  else if(m==='melody'){ S.max=S.pulses=Ly.targets.length*2; }
  else if(m==='coop'){ S.max=S.pulses=budget(Ly)+2; }
  else if(m==='duel'){ S.ppMax=Math.ceil(Ly.targets.length*0.8)+1; S.pp=[0,S.ppMax,S.ppMax]; S.max=S.pulses=0; }
  else { S.max=S.pulses=budget(Ly); }
  if(m==='rhythm'){ S.rh={ beat:0.6, lives:5, next:0.6, n:0, flash:-9, lastBeat:0, onBeat:0 }; }
  if(m==='arcade'){ if(S.level>=10) award('arc10'); if(S.level>=20) award('arc20'); }
  if(m==='coop' && S.level>=5) award('coop5');
  S.phase='play';
  showTip(Ly);
  renderHud();
}
function effL(){ return S.mode==='daily'||S.mode==='replay' ? DAILY_LEVELS[S.level-1] : S.level; }
function showTip(Ly){
  const T=Ly.targets; let txt='', mid=false, strong=false;
  const once=k=>{ if(!txt && !seen.has(k)){ seen.add(k); txt=tip(k); } };
  if(S.mode==='tuto'){ txt=t('tuto')[S.level-1]; strong=true; }
  if(S.mode==='puzzle') once('puzzle');
  if(S.mode==='duel'){ once('duel'); mid=true; }
  if(S.mode==='coop'){ once('coop'); mid=true; }
  if(S.mode==='chrono') once('chrono');
  if(S.mode==='surv') once('surv');
  if(S.mode==='rhythm') once('rhythm');
  if(S.mode==='melody') once('melody');
  if(S.mode==='camp' && T.some(x=>x.boss)) once('boss');
  if(!['replay','tuto'].includes(S.mode)){
    if(S.level===1 && ['arcade','daily','zen'].includes(S.mode)) once('base');
    if((Ly.beacons||[]).length) once('beacon');
    if((Ly.delays||[]).length) once('delay');
    if(T.some(x=>x.chroma)) once('chroma');
    if((Ly.currents||[]).length) once('currents');
    if(T.some(x=>x.freq)) once('freq');
    if((Ly.portals||[]).length) once('portal');
    if((Ly.jammers||[]).length) once('jam');
    if(T.some(x=>x.battery)) once('battery');
    if(T.some(x=>x.decay)) once('decay');
    if(Ly.walls.some(w=>w.mirror)) once('mirror');
    if(Ly.walls.some(w=>!w.mirror)) once('walls');
    if(Ly.prisms.length) once('prisms');
    if((Ly.muds||[]).length) once('mud');
    if(T.some(x=>x.twin!=null)) once('twin');
    if(T.some(x=>x.fragile)) once('fragile');
    if(T.some(x=>x.need===3)) once('triple');
    if(T.some(x=>x.vx)) once('drift');
  }
  const te=$('tip'); te.classList.toggle('mid',mid); te.classList.toggle('high',S.mode==='tuto'||S.freezes>0); te.classList.toggle('strong',strong);
  if(txt){ te.textContent=txt; te.hidden=false; te.style.opacity=1; } else te.hidden=true;
}
function dots(el,n,max){
  el.innerHTML='';
  for(let i=0;i<max;i++){ const d=document.createElement('i'); if(i<n) d.className='on'; el.appendChild(d); }
}
function renderHud(){
  const m=S.mode, duel=m==='duel';
  $('hud').hidden=duel; $('duelTop').hidden=$('duelBot').hidden=!duel;
  const fb=$('freezeBtn'); fb.hidden=!(S.freezes>0||S.freezeArmed); $('freezeN').textContent=S.freezes; fb.classList.toggle('armed',S.freezeArmed);
  if(duel){
    const own=k=>G.targets.filter(x=>x.lit&&x.owner===k).length;
    $('d1').textContent=own(1); $('d2').textContent=own(2);
    dots($('dp1'),S.pp[1],S.ppMax); dots($('dp2'),S.pp[2],S.ppMax); return;
  }
  $('lvlLabel').textContent=t('lb_'+m);
  let lv=S.level;
  if(m==='daily'||m==='replay') lv=`${S.level}/6`;
  else if(m==='puzzle') lv=`${S.level}/${PUZZLES.length}`;
  else if(m==='tuto') lv=`${S.level}/${TUTO.length}`;
  else if(m==='chrono') lv=Math.ceil(S.timeLeft);
  else if(m==='surv') lv=`${Math.floor(S.survT)} s`;
  else if(m==='custom') lv='—';
  else if(m==='camp') lv=`${S.camp.w+1}·${S.camp.i===9?'G':S.camp.i+1}`;
  else if(m==='rhythm') lv=S.rh?S.rh.lives:5;
  $('lvl').textContent=lv;
  const el=$('pulses');
  if(S.max===Infinity) el.innerHTML='<span class="inf">∞</span>'; else dots(el,S.pulses,S.max);
  $('scoreLabel').textContent = t(m==='zen'?'sc_nodes' : m==='puzzle'?'sc_try' : m==='surv'?'sc_off' : m==='tuto'?'sc_step' : 'sc_score');
  $('score').textContent = m==='zen'?S.zenLit : m==='puzzle'?S.fails+1 : m==='surv'?`${G.targets.filter(x=>!x.lit).length}/8` : m==='tuto'?S.level : fmt(S.score);
}
function addTotal(n){
  if(n<=0) return; const tot=+store.get('resonance.total',0)+n; store.set('resonance.total',tot);
  if(tot>=THEMES[1].need) award('palette');
}

/* ---------- entrées ---------- */
function ownerAt(y){ return SPLIT.includes(S.mode) ? (y<H/2?2:1) : 0; }
function fire(x,y,freq){
  const owner=ownerAt(y);
  const freeze=S.freezeArmed;
  if(freeze){ S.freezeArmed=false; S.freezes--; }
  else if(S.mode==='duel'){ if(S.pp[owner]<=0) return; S.pp[owner]--; }
  else { if(S.pulses<=0) return; S.pulses--; }
  let tag=null;
  if(S.mode==='rhythm' && S.rh){ const d=Math.min(Math.abs(G.t-S.rh.lastBeat), Math.abs(S.rh.next-G.t)); if(d<=0.09){ tag='beat'; S.marks.push({x,y:y-14,t:G.t,txt:t('mk_beat')}); } }
  S.tapLog.push({ s:G.stepN, nx:(x-G.env.x0)/G.env.w, ny:(y-G.env.y0)/G.env.h, f:freq||null, z:freeze?1:0 });
  E.tap(G,x,y,owner,freq,{tag,freeze});
  S.marks.push({x,y,t:G.t,owner});
  if(S.mode==='tuto') S.tutoTaps++;
  STATS.waves++; if(STATS.waves>=1000) award('waves1000');
  tone((S.mode==='zen'?SCALE[Math.floor(Math.random()*5)]:SCALE[0])*(freq==='low'?0.25:0.5),0.2,'triangle',0.05); buzz(8);
  const tp=$('tip'); if(!tp.hidden && S.mode!=='tuto') tp.style.opacity=0.35;
  renderHud();
}
function beaconAt(x,y){ if(!G) return -1; const R=nodeR(); return G.beacons.findIndex(b=>Math.hypot(b.x-x,b.y-y)<R*1.8); }
function beaconOn(i,owner,id){
  const b=G.beacons[i]; if(b.active) return;
  if(S.mode==='duel'){ if(S.pp[owner]<=0) return; S.pp[owner]--; } else { if(S.pulses<=0) return; S.pulses--; }
  b.active=true; b.next=G.t; b.owner=owner; S.bhold={id,i,t0:G.t};
  S.tapLog.push({ s:G.stepN, b:i, on:1 }); renderHud();
}
function beaconOff(){
  if(!S.bhold||!G) return; const b=G.beacons[S.bhold.i]; if(b) b.active=false;
  S.tapLog.push({ s:G.stepN, b:S.bhold.i, on:0 }); S.bhold=null;
}
cv.addEventListener('pointerdown',e=>{
  if(S.mode==='editor'&&S.phase==='edit'){ e.preventDefault(); return edTap(e.clientX,e.clientY); }
  if(S.phase!=='play'||S.mode==='replay'||!G) return;
  e.preventDefault();
  const bi=beaconAt(e.clientX,e.clientY);
  if(bi>=0 && !S.freezeArmed){ beaconOn(bi,ownerAt(e.clientY),e.pointerId); return; }
  if(G.hasFreq && !S.freezeArmed){ S.hold={x:e.clientX,y:e.clientY,t0:performance.now(),id:e.pointerId}; return; }
  fire(e.clientX,e.clientY,null);
});
const release=e=>{
  if(S.bhold && e.pointerId===S.bhold.id){ beaconOff(); return; }
  if(!S.hold||e.pointerId!==S.hold.id) return;
  const h=S.hold; S.hold=null;
  if(S.phase!=='play'||!G) return;
  fire(h.x,h.y,(performance.now()-h.t0)/1000>=HOLD?'low':'high');
};

/* ---------- événements moteur ---------- */
function onEvent(type,nd){
  if(type==='light'){
    const d=nd.depth, m=S.mode;
    let note = m==='zen' ? SCALE[Math.floor(Math.random()*SCALE.length)] : SCALE[Math.min(d+2,SCALE.length-1)];
    if(m==='melody') note=nd.note;
    tone(note,0.7,null,0.09); tone(note*1.5,0.5,null,0.035,0.06); buzz(d>1?[12,30,12]:15);
    STATS.lit++; STATS.chain=Math.max(STATS.chain,d);
    if(nd.spread!=null){ STATS.precSum+=Math.max(0,1-nd.spread/G.win); STATS.precN++; if(nd.spread<0.015) award('perfect'); }
    award('first'); if(d>=3) award('chain3'); if(d>=5) award('chain5'); if(d>=7) award('chain7');
    if(nd.need===3) award('triple'); if(nd.byVia) award('mirror'); if(nd.byPortal) award('portal');
    if(nd.battery && S.max!==Infinity && m!=='duel'){ S.pulses++; S.max=Math.max(S.max,S.pulses); STATS.batt++; if(STATS.batt>=10) award('batt10'); S.marks.push({x:nd.x,y:nd.y+18,t:G.t,txt:t('mk_pulse')}); }
    let wrong=false;
    if(m==='melody'){
      if(nd.seq===S.expect){ S.expect++; }
      else {
        wrong=true; S.melodyFails++; S.expect=0;
        G.targets.forEach(o=>{ o.lit=false; o.hits=[]; });
        S.marks.push({x:nd.x,y:nd.y,t:G.t,txt:t('mk_wrong'),bad:true}); tone(120,0.5,'sawtooth',0.04);
      }
    }
    if(m==='surv'){ S.pulses=Math.min(S.pulses+1,S.max); }
    let gain=0;
    if(['arcade','daily','replay','surv','melody','custom','camp','coop','rhythm'].includes(m) && !wrong) gain=100*d;
    else if(m==='chrono') gain=d>1?100*(d-1):0;
    else if(m==='zen'){ S.zenLit++; const z=+store.get('resonance.zen',0)+1; store.set('resonance.zen',z); if(z>=100) award('zen100'); }
    if(m==='rhythm' && nd.onBeat){ gain*=2; S.rh.onBeat++; if(S.rh.onBeat>=10) award('beat10'); }
    if(gain){ S.score+=gain; if(!['replay','custom'].includes(m)) addTotal(gain); S.marks.push({x:nd.x,y:nd.y,t:G.t,txt:`+${fmt(gain)}`}); }
    if(m==='daily') S.levelDepth=Math.max(S.levelDepth,d);
    renderHud();
  } else if(type==='prism'){ tone(SCALE[7],0.25,'triangle',0.035); }
  else if(type==='portal'){ tone(SCALE[9],0.2,'sine',0.03); tone(SCALE[6],0.2,'sine',0.03,0.05); }
  else if(type==='delay'){ tone(SCALE[3],0.15,'triangle',0.025); }
  else if(type==='echo'){ tone(SCALE[3],0.3,'triangle',0.04); }
  else if(type==='beacon'){ tone(SCALE[2],0.15,'triangle',0.035); buzz(6); }
  else if(type==='freeze'){ award('freeze'); tone(SCALE[10],0.3,'sine',0.03); S.marks.push({x:nd.x,y:nd.y,t:G.t,txt:t('mk_frozen')}); }
  else if(type==='arm'){ tone(SCALE[5],0.2,'triangle',0.03); }
  else if(type==='break'){ tone(110,0.5,'sawtooth',0.04); buzz([20,40,20]); S.marks.push({x:nd.x,y:nd.y,t:G.t,txt:t('mk_broken'),bad:true}); }
  else if(type==='fade'){ tone(140,0.4,'triangle',0.04); S.marks.push({x:nd.x,y:nd.y,t:G.t,txt:t('mk_off'),bad:true}); }
}

function banner(big,small){ const b=$('banner'); b.textContent=big; if(small){ const s=document.createElement('small'); s.textContent=small; b.appendChild(s); } b.classList.add('show'); }
function hideBanner(){ $('banner').classList.remove('show'); }

function spawnNode(minD,extra){
  const env=G.env, R=nodeR();
  for(let k=0;k<60;k++){
    const nd=Object.assign({nx:0.05+Math.random()*0.9, ny:0.05+Math.random()*0.9, need:2},extra||{});
    const p=E.pos(G,nd);
    if(G.targets.every(o=>Math.hypot(o.x-p.x,o.y-p.y)>minD*env.U) && G.prisms.every(o=>Math.hypot(o.x-p.x,o.y-p.y)>R*3)){ return E.addTarget(G,nd); }
  }
  return null;
}
function survTick(){
  const before=Math.floor(S.survT*4);
  S.survT+=STEP; if(S.survT>=60) award('surv60');
  G.targets=G.targets.filter(x=>!(x.lit && G.t-x.litT>2.2));
  S.spawnT-=STEP;
  if(S.spawnT<=0){
    S.spawnT=Math.max(1.1, 3.2-S.survT*0.025);
    if(spawnNode(0.16,{need:Math.random()<Math.min(0.1+S.survT/300,0.35)?3:2})) tone(SCALE[1],0.15,'triangle',0.025);
  }
  if(Math.floor(S.survT*4)!==before) renderHud();
  const off=G.targets.filter(x=>!x.lit).length;
  if(off>=8 || (S.pulses<=0 && !E.active(G))) endSurv();
}
function rhythmTick(){
  const rh=S.rh;
  if(G.t>=rh.next){
    rh.lastBeat=rh.next; rh.next+=rh.beat; rh.n++; rh.flash=G.t;
    if(S.pulses<S.max){ S.pulses++; renderHud(); }
    if(rh.n%2===1) kick(); osc(6200,0.04,'square',0.012,0);
    const bass=[0,0,4,3][Math.floor(rh.n/2)%4]; if(rh.n%2===1) osc(SCALE[bass]*0.25,0.35,'triangle',0.06,0);
    // la cadence d'apparition double après une minute
    if(rh.n%(rh.n>100?1:2)===0 && G.targets.filter(x=>!x.lit).length<6){ const nd=spawnNode(0.18); if(nd) nd.expire=G.t+rh.beat*6; }
  }
  G.targets=G.targets.filter(x=>{
    if(x.lit) return G.t-x.litT<1.5;
    if(x.expire && G.t>x.expire){ rh.lives--; S.marks.push({x:x.x,y:x.y,t:G.t,txt:t('mk_miss'),bad:true}); tone(130,0.3,'triangle',0.05); renderHud(); return false; }
    return true;
  });
  if(rh.lives<=0) endRhythm();
}

function campClear(){
  const {w,i}=S.camp, k=campKey(w,i), left=S.pulses;
  const need3=Math.ceil(S.max*0.35);
  const stars = left>=need3 ? 3 : left>=1 ? 2 : 1;
  if(!CAMP[k] || stars>CAMP[k]) CAMP[k]=stars; store.set('resonance.camp',JSON.stringify(CAMP));
  addTotal(100*stars);
  if(i===9 && w===0) award('world1'); if(i===9 && w===WORLDS.length-1) award('camp'); if(campStars()>=100) award('stars100');
  S.phase='over';
  const next = i<9 ? {w,i:i+1} : (w<WORLDS.length-1 ? {w:w+1,i:0} : null);
  showEnd({ kicker:`${worldName(w)} · ${i===9?t('cp_boss'):t('cp_grid',{n:i+1})}`, title:'★'.repeat(stars)+'☆'.repeat(3-stars),
    msg: stars===3 ? t('cp_3') : t('cp_keep',{n:need3}),
    btns:[ ...(next?[{label:t(i===9?'next_sea':'next_grid'), fn:()=>playCamp(next.w,next.i)}]:[]),
           {label:t('replay'), ghost:true, fn:()=>playCamp(w,i)}, {label:t('map'), ghost:true, fn:openCamp} ] });
}

function checkState(){
  const m=S.mode;
  if(S.bhold && G.t-S.bhold.t0>5) beaconOff();
  if(m==='surv') return survTick();
  if(m==='rhythm') return rhythmTick();
  if(m==='chrono'){ S.timeLeft-=STEP; if(S.timeLeft<=0){ S.timeLeft=0; return endChrono(); } }
  if(E.allLit(G) && (m!=='melody' || S.expect>=G.targets.length)){
    S.phase='clear'; S.clearT=G.t; beaconOff();
    [0,0.08,0.16].forEach((d,i)=>tone(SCALE[4+i*2],0.7,null,0.06,d));
    if(m==='zen'){ banner(t('bn_harmony'),t('bn_newgrid')); return; }
    if(m==='chrono'){ S.score+=200; addTotal(200); banner('+200',t('bn_gridfull')); return; }
    if(m==='camp') return campClear();
    if(m==='tuto'){ banner(t('bn_step',{n:S.level}), t(S.level<TUTO.length?'bn_next':'bn_tutodone')); return; }
    if(m==='puzzle'){
      const solved=+store.get('resonance.puzzle',0); if(S.level>solved){ store.set('resonance.puzzle',S.level); addTotal(300); }
      if(S.fails===0) award('puz1'); if(+store.get('resonance.puzzle',0)>=PUZZLES.length) award('puzall');
      banner(t('bn_solved'), t('bn_puz',{k:S.level,n:S.fails+1})); return;
    }
    if(m==='duel') return endDuel();
    if(m==='custom'){ S.phase='over'; const u=S.max-S.pulses;
      return showEnd({ kicker:t('cu_k'), title:t('cu_ok'), msg:`${t('cu_used',{n:u,m:S.max})} ${t('e_score',{n:S.score})}`,
        btns:[ {label:t('to_editor'), fn:openEditor}, {label:t('replay'), ghost:true, fn:()=>{ S.score=0; makeLevel(); }} ] }); }
    if(m==='melody'){
      if(S.melodyFails===0) award('melody');
      const bonus=S.pulses*50; S.score+=bonus; addTotal(bonus); saveBest();
      banner(t('bn_melody',{n:S.level}), S.melodyFails?t('bn_wrongs',{n:S.melodyFails}):t('bn_clean'));
      playMelody(); return;
    }
    const bonus=S.pulses*50; S.score+=bonus; if(m!=='replay') addTotal(bonus);
    if(m==='arcade' && S.pulses>=S.max/2) award('thrift');
    if(m==='daily'){ S.dailyRuns[S.level-1]=S.tapLog.slice(); S.dailyStats[S.level-1]={used:S.max-S.pulses,max:S.max,chain:S.levelDepth||1}; }
    const head = m==='daily'||m==='replay' ? `${S.level} / 6` : m==='coop' ? t('bn_coop',{n:S.level}) : t('bn_level',{n:S.level});
    banner(head, m==='replay'?t('bn_replay'):bonus?t('bn_kept',{n:bonus}):t('bn_full'));
    saveBest(); renderHud(); return;
  }
  if(E.active(G)) return;
  if(m==='duel'){ if(S.pp[1]<=0&&S.pp[2]<=0) endDuel(); return; }
  if(m==='tuto'){
    const need=TUTO[S.level-1].hints.length;
    if((S.pulses===Infinity && S.tutoTaps>=Math.max(need,1)) || S.pulses<=0){ S.phase='retry'; S.clearT=G.t; banner(t('bn_almost'),t('bn_retry')); }
    return;
  }
  if(S.pulses>0) return;
  if(m==='puzzle'){ S.phase='retry'; S.clearT=G.t; S.fails++; banner(t('bn_missed'),t('bn_retry')); tone(150,0.4,'triangle',0.05); return; }
  if(m==='replay'){ S.phase='clear'; S.clearT=G.t; return; }
  S.phase='over'; saveBest();
  const left=G.targets.filter(x=>!x.lit).length, nodesTxt=t('e_left',{n:left});
  if(m==='custom') return showEnd({ kicker:t('cu_k'), bad:true, title:t('cu_fail'), msg:`${nodesTxt} ${t('cu_fail_msg')}`,
    btns:[ {label:t('retry'), fn:()=>{ S.score=0; makeLevel(); }}, {label:t('to_editor'), ghost:true, fn:openEditor} ] });
  if(m==='camp') return showEnd({ kicker:worldName(S.camp.w), bad:true, title:t('e_silence'), msg:nodesTxt,
    btns:[ {label:t('retry'), fn:()=>playCamp(S.camp.w,S.camp.i)}, {label:t('map'), ghost:true, fn:openCamp} ] });
  showEnd({ kicker:t('e_nopulse'), bad:true, title:t('e_silence'), msg:`${nodesTxt} ${t('e_score',{n:S.score})}`,
    btns:[ {label:t('replay_lvl'), fn:()=>{ S.score=S.levelStartScore; if(S.mode==='daily') S.dailyRetries++; S.levelDepth=0; S.melodyFails=0; makeLevel(); }},
           {label:t('menu'), ghost:true, fn:toMenu} ] });
  tone(130,0.6,'triangle',0.07);
}
function playMelody(){ [...G.targets].sort((a,b)=>a.seq-b.seq).forEach((x,i)=>tone(x.note,0.5,'sine',0.06,0.5+i*0.22)); }
function afterClear(){
  const m=S.mode, el=G.t-S.clearT;
  if(S.phase==='retry'){ if(el>0.9){ hideBanner(); makeLevel(); } return; }
  if(el < (m==='chrono'?0.7:m==='melody'?2.6:1.6)) return;
  hideBanner();
  if(m==='chrono'){ S.grids++; S.level++; return makeLevel(); }
  if(m==='daily' && S.level>=6) return endDaily();
  if(m==='replay' && S.level>=6) return endReplay();
  if(m==='puzzle' && S.level>=PUZZLES.length) return endPuzzles();
  if(m==='tuto' && S.level>=TUTO.length) return endTuto();
  S.level++; S.levelDepth=0; S.fails=0; S.melodyFails=0; makeLevel();
}
function saveBest(){
  const keys={arcade:'resonance.best',chrono:'resonance.chrono',melody:'resonance.melody',rhythm:'resonance.rhythm'};
  const k=keys[S.mode]; if(k && S.score>+store.get(k,0)) store.set(k,S.score);
  if(S.mode==='coop' && S.level>+store.get('resonance.coop',0)) store.set('resonance.coop',S.level);

function edTap(x,y){
  const d=ED.draft, env=G.env;
  const nx=(x-env.x0)/env.w, ny=(y-env.y0)/env.h;
  if(nx<0||nx>1||ny<0||ny>1) return;
  const cl=v=>Math.min(Math.max(v,0.04),0.96), q={nx:cl(nx),ny:cl(ny)};
  const near=(o,r=26)=>Math.hypot((o.nx-nx)*env.w,(o.ny-ny)*env.h)<r;
  const segNear=w=>{ const h=w.len*env.U/2, cx=w.nx*env.w, cy=w.ny*env.h, ax=cx-Math.cos(w.a)*h, ay=cy-Math.sin(w.a)*h, bx=cx+Math.cos(w.a)*h, by=cy+Math.sin(w.a)*h;
    const px=nx*env.w, py=ny*env.h, dx=bx-ax, dy=by-ay, k=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy))); return Math.hypot(px-ax-k*dx,py-ay-k*dy)<20; };

    let i;

    else if((i=d.prisms.findIndex(o=>near(o)))>=0) d.prisms.splice(i,1);
    else if((i=d.portals.findIndex(p=>near(p.a)||near(p.b)))>=0) d.portals.splice(i,1);
    else if((i=d.walls.findIndex(segNear))>=0) d.walls.splice(i,1);
    else if((i=d.muds.findIndex(m=>near(m,m.r*env.U)))>=0) d.muds.splice(i,1);

    const o=d.targets.find(o=>near(o));
    if(o){ const k=((o._k||0)+1)%NODE_TYPES.length;
      for(const kk of Object.keys(o)) if(kk!=='nx'&&kk!=='ny') delete o[kk];
      Object.assign(o,NODE_TYPES[k],{_k:k}); toast(t('nt')[k]); }
    else if(d.targets.length<14) d.targets.push({...q,need:2,_k:0});
    else toast(t('max_nodes'));
  } else if(tool==='prism'){ if(!d.prisms.some(o=>near(o))) d.prisms.push(q); }
  else if(tool==='wall'||tool==='mirror'){
    const w=d.walls.find(segNear);

  edRefresh();
}
function encodeDraft(d){

    w:d.walls.map(w=>[r(w.nx),r(w.ny),Math.round(w.a*180/Math.PI),r(w.len),w.mirror?1:0]),
    m:d.muds.map(m=>[r(m.nx),r(m.ny),r(m.r)]), o:d.portals.map(p=>[r(p.a.nx),r(p.a.ny),r(p.b.nx),r(p.b.ny)]), n:d.pulses };

function decodeDraft(code){

function ringColor(r){
  if(SPLIT.includes(S.mode)) return r.owner===2?C.p2:C.saffron;
  if(r.freeze) return C.p2;
  if(r.hue!=null && G.prisms.some(p=>p.hue!=null)) return r.hue===0?C.rose:C.p2;
  return r.kind==='chain'?C.saffron : r.kind==='prism'?C.rose : r.kind==='delay'?C.dust : C.bone;
}
function ringPath(g,r){
  g.beginPath();
  if(r.via||!G.muds.length){ g.arc(r.x,r.y,Math.max(r.r,0.1),0,TAU); return; }
  const N=120;
  if(!r.ivc){
    r.ivc=[];
    for(let i=0;i<N;i++){
      const th=i/N*TAU, ux=Math.cos(th), uy=Math.sin(th), iv=[];
      for(const m of G.muds){ const fx=r.x-m.x, fy=r.y-m.y, b=fx*ux+fy*uy, c=fx*fx+fy*fy-m.rr*m.rr, d=b*b-c;
        if(d<=0) continue; const q=Math.sqrt(d), t1=Math.max(-b-q,0), t2=-b+q; if(t2>t1) iv.push([t1,t2]); }
      iv.sort((a,b)=>a[0]-b[0]); r.ivc.push(iv);
    }
  }
  for(let i=0;i<=N;i++){
    const k=i%N, th=k/N*TAU; let rho=0, rem=r.r;
    for(const [a,b] of r.ivc[k]){
      if(a>rho){ const f=a-rho; if(rem<=f){ rho+=rem; rem=0; break; } rho=a; rem-=f; }
      const cost=(b-Math.max(a,rho))*K_MUD; if(rem<=cost){ rho+=rem/K_MUD; rem=0; break; } rho=b; rem-=cost;
    }
    rho+=rem;
    const x=r.x+Math.cos(th)*rho, y=r.y+Math.sin(th)*rho; i?g.lineTo(x,y):g.moveTo(x,y);
  }
}
function strokeRing(g,r,a){

  if(thin) g.setLineDash([7,6]); else if(r.freeze) g.setLineDash([2,6]); else if(r.kind==='delay') g.setLineDash([12,4]);
  g.strokeStyle=`rgba(${col},${a*0.14})`; g.lineWidth=thick?16:10; g.stroke();
  g.strokeStyle=`rgba(${col},${a*0.9})`; g.lineWidth=thick?3.4:r.freeze?2.6:1.6; g.stroke();
  g.setLineDash([]);
}
function sideOf(e,x,y){ return Math.sign((e[2]-e[0])*(y-e[1])-(e[3]-e[1])*(x-e[0])); }
function drawRings(){
  const diag=Math.hypot(W,H), far=diag*3;
  G.rings=G.rings.filter(r=>r.r<=Math.max(r.lim,diag*1.15));
  const occl = G.walls.length || G.jammers.length;
  for(const r of G.rings){
    const a=Math.max(0,1-r.r/(diag*1.15)); if(a<=0) continue;
    if(!occl && !r.via){ strokeRing(ctx,r,a); continue; }
    const x0=Math.max(0,Math.floor(r.x-r.r-10)), y0=Math.max(0,Math.floor(r.y-r.r-10));
    const x1=Math.min(W,Math.ceil(r.x+r.r+10)), y1=Math.min(H,Math.ceil(r.y+r.r+10));
    if(x1<=x0||y1<=y0) continue;
    lctx.clearRect(x0,y0,x1-x0,y1-y0);
    strokeRing(lctx,r,a);
    const cone=(e)=>{ const [ax,ay,bx,by]=e, da=Math.hypot(ax-r.x,ay-r.y)||1, db=Math.hypot(bx-r.x,by-r.y)||1;
      lctx.beginPath(); lctx.moveTo(ax,ay); lctx.lineTo(bx,by);
      lctx.lineTo(bx+(bx-r.x)/db*far,by+(by-r.y)/db*far); lctx.lineTo(ax+(ax-r.x)/da*far,ay+(ay-r.y)/da*far); lctx.closePath(); lctx.fill(); };
    lctx.fillStyle='#000';
    if(r.via){ lctx.globalCompositeOperation='destination-in'; cone(r.via.e); }
    lctx.globalCompositeOperation='destination-out';
    const vs = r.via ? sideOf(r.via.e,r.x,r.y) : 0;
    for(const w of G.walls){
      if(w===r.via) continue;
      if(r.via && sideOf(r.via.e,w.e[0],w.e[1])===vs && sideOf(r.via.e,w.e[2],w.e[3])===vs) continue;
      cone(w.e);
    }
    for(const j of G.jammers){
      const dx=j.x-r.x, dy=j.y-r.y, d=Math.hypot(dx,dy);
      lctx.beginPath(); lctx.arc(j.x,j.y,j.rr,0,TAU); lctx.fill();
      if(d<=j.rr+1) continue;
      const base=Math.atan2(dy,dx), al=Math.asin(j.rr/d), L=Math.sqrt(d*d-j.rr*j.rr);
      const p1=[r.x+Math.cos(base-al)*L, r.y+Math.sin(base-al)*L], p2=[r.x+Math.cos(base+al)*L, r.y+Math.sin(base+al)*L];
      lctx.beginPath(); lctx.moveTo(p1[0],p1[1]); lctx.lineTo(p1[0]+Math.cos(base-al)*far,p1[1]+Math.sin(base-al)*far);
      lctx.lineTo(p2[0]+Math.cos(base+al)*far,p2[1]+Math.sin(base+al)*far); lctx.lineTo(p2[0],p2[1]); lctx.closePath(); lctx.fill();
    }
    lctx.globalCompositeOperation='source-over';
    ctx.drawImage(lay,x0*DPR,y0*DPR,(x1-x0)*DPR,(y1-y0)*DPR,x0,y0,x1-x0,y1-y0);
  }
}

    ctx.save(); ctx.beginPath(); ctx.arc(c.x,c.y,c.rr,0,TAU); ctx.clip(); ctx.translate(c.x,c.y); ctx.rotate(a);
    ctx.strokeStyle=`rgba(${C.p2},0.45)`; ctx.lineWidth=1.4;
    for(let yy=-c.rr+10; yy<c.rr; yy+=16) for(let xx=-c.rr-24+off; xx<c.rr; xx+=24){ ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx+8,yy); ctx.lineTo(xx+5,yy-3); ctx.moveTo(xx+8,yy); ctx.lineTo(xx+5,yy+3); ctx.stroke(); }
    ctx.restore();
  }
  for(const m of G.muds){
    const g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.rr);
    g.addColorStop(0,`rgba(${C.dust},0.32)`); g.addColorStop(1,`rgba(${C.dust},0.08)`);
    ctx.beginPath(); ctx.arc(m.x,m.y,m.rr,0,TAU); ctx.fillStyle=g; ctx.fill();
    for(let i=1;i<=3;i++){ ctx.beginPath(); ctx.arc(m.x,m.y,m.rr*(i/3.4)+(reduce?0:Math.sin(tt*1.2+i)*2),0,TAU); ctx.strokeStyle=`rgba(${C.dust},0.28)`; ctx.lineWidth=1; ctx.stroke(); }
  }
  if(S.mode==='puzzle' && S.fails>=4 && S.layout.hint){
    const hx=G.env.x0+S.layout.hint[0]*G.env.w, hy=G.env.y0+S.layout.hint[1]*G.env.h, k=reduce?0.5:(Math.sin(tt*3)+1)/2;
    ctx.setLineDash([3,5]); ctx.beginPath(); ctx.arc(hx,hy,G.env.U*0.045+k*4,0,TAU); ctx.strokeStyle=`rgba(${C.bone},${0.35+k*0.35})`; ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]);
  }
  if(S.mode==='tuto'){
    TUTO[S.level-1].hints.forEach(([hx,hy],i)=>{
      const x=G.env.x0+hx*G.env.w, y=G.env.y0+hy*G.env.h, next=i===S.tutoTaps, k=reduce?0.5:(Math.sin(tt*4)+1)/2;
      ctx.beginPath(); ctx.arc(x,y,16+(next?k*5:0),0,TAU); ctx.fillStyle=`rgba(${C.saffron},${next?0.22:0.06})`; ctx.fill();
      ctx.strokeStyle=`rgba(${C.saffron},${next?0.9:0.35})`; ctx.lineWidth=1.5; ctx.stroke();
      label(String(i+1),x,y+1,next?C.saffron:C.dust,12);
    });
  }
  drawRings();
  for(const j of G.jammers){
    ctx.beginPath(); ctx.arc(j.x,j.y,j.rr,0,TAU); ctx.fillStyle=TH.ink; ctx.fill();
    ctx.strokeStyle=`rgba(${C.rose},0.8)`; ctx.lineWidth=1.5; ctx.setLineDash([2,3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.save(); ctx.beginPath(); ctx.arc(j.x,j.y,Math.max(j.rr-3,1),0,TAU); ctx.clip(); ctx.fillStyle=`rgba(${C.dust},0.6)`;
    const sd=Math.floor((reduce?0:tt)*12);
    for(let i=0;i<26;i++){ const a=((i*137+sd*29)%360)*Math.PI/180, rr=((i*53+sd*17)%100)/100*j.rr; ctx.fillRect(j.x+Math.cos(a)*rr-1,j.y+Math.sin(a)*rr-1,2,2); }
    ctx.restore();
  }
  ctx.lineCap='round';
  for(const w of G.walls){
    const [ax,ay,bx,by]=w.e; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
    if(w.mirror){ ctx.strokeStyle=`rgba(${C.bone},0.25)`; ctx.lineWidth=9; ctx.stroke(); ctx.strokeStyle=`rgba(${C.bone},0.95)`; ctx.lineWidth=3; ctx.stroke(); }
    else { ctx.strokeStyle=`rgba(${C.dust},0.9)`; ctx.lineWidth=7; ctx.stroke(); ctx.strokeStyle=`rgba(${C.bone},0.3)`; ctx.lineWidth=1.5; ctx.stroke(); }
  }
  G.gates.forEach((g,i)=>{
    const k=Math.max(0,1-(tt-g.lastT)/0.5);
    ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(reduce?0:tt*(i%2?-0.8:0.8));
    ctx.setLineDash([5,4]); ctx.beginPath(); ctx.arc(0,0,R*0.9,0,TAU); ctx.strokeStyle=`rgba(${C.p2},${0.6+k*0.4})`; ctx.lineWidth=2.2; ctx.stroke();
    ctx.setLineDash([]); ctx.beginPath(); ctx.arc(0,0,R*0.45,0,TAU); ctx.fillStyle=`rgba(${C.p2},${0.15+k*0.5})`; ctx.fill(); ctx.restore();
  });
  for(const d of G.delays){
    const pend=G.pending.find(p=>p.d===d), k=pend?1-(pend.t-tt):0;
    ctx.beginPath(); ctx.arc(d.x,d.y,R*0.8,0,TAU); ctx.strokeStyle=`rgba(${C.bone},0.6)`; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(d.x,d.y,R*0.8,-Math.PI/2,-Math.PI/2+k*TAU); ctx.strokeStyle=`rgba(${C.bone},0.95)`; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x,d.y-R*0.5); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x+R*0.35,d.y); ctx.strokeStyle=`rgba(${C.bone},0.8)`; ctx.lineWidth=1.6; ctx.stroke();
  }
  for(const b of G.beacons){
    const ph=b.active?((tt-b.next+b.period)/b.period):0, k=b.active?Math.max(0,1-ph):0;
    ctx.beginPath(); ctx.arc(b.x,b.y,R*1.05+k*4,0,TAU); ctx.fillStyle=`rgba(${C.saffron},${0.12+k*0.4})`; ctx.fill();
    ctx.strokeStyle=`rgba(${C.saffron},0.9)`; ctx.lineWidth=2; ctx.stroke();
    for(let i=1;i<=2;i++){ ctx.beginPath(); ctx.arc(b.x,b.y,R*0.35*i,0,TAU); ctx.strokeStyle=`rgba(${C.saffron},0.6)`; ctx.lineWidth=1.2; ctx.stroke(); }
  }
  if(S.mode==='editor' && ED && ED.draft._pend){ const p=E.pos(G,ED.draft._pend); ctx.setLineDash([5,4]); ctx.beginPath(); ctx.arc(p.x,p.y,R*0.9,0,TAU); ctx.strokeStyle=`rgba(${C.p2},0.6)`; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]); }
  const chromaLvl=G.prisms.some(p=>p.hue!=null);
  for(const p of G.prisms){
    const k=Math.max(0,1-(tt-p.lastT)/0.5), s=R*0.62*(1+k*0.25), col=p.hue==null?C.rose:(p.hue===0?C.rose:C.p2);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.PI/4+(reduce?0:tt*0.4));
    ctx.beginPath(); ctx.rect(-s,-s,s*2,s*2); ctx.fillStyle=`rgba(${col},${0.12+k*0.6})`; ctx.fill();
    ctx.strokeStyle=`rgb(${col})`; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    if(chromaLvl && p.hue!=null) label(p.hue===0?'A':'B',p.x,p.y+1,col,10);
  }
  const done=new Set();
  for(const n of G.targets){
    if(n.twin==null||done.has(n)) continue; const o=G.targets[n.twin]; if(!o) continue; done.add(o);
    ctx.setLineDash([2,7]); ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(o.x,o.y);
    ctx.strokeStyle=`rgba(${n.lit&&o.lit?C.saffron:C.bone},0.35)`; ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]);
  }
  S.marks=S.marks.filter(m=>tt-m.t<1.2);
  for(const m of S.marks){
    const k=(tt-m.t)/1.2;
    if(m.txt){ ctx.fillStyle=`rgba(${m.bad?C.rose:C.saffron},${1-k})`; ctx.font='700 13px Unbounded, sans-serif'; ctx.textAlign='center'; ctx.fillText(m.txt,m.x,m.y-30-k*24); }
    else { ctx.beginPath(); ctx.arc(m.x,m.y,4+k*6,0,TAU); ctx.fillStyle=`rgba(${m.owner===2?C.p2:m.owner===1?C.saffron:C.bone},${0.8*(1-k)})`; ctx.fill(); }
  }
  if(S.hold){
    const h=(performance.now()-S.hold.t0)/1000, k=Math.min(h/HOLD,1);
    ctx.beginPath(); ctx.arc(S.hold.x,S.hold.y,10+k*16,0,TAU); ctx.strokeStyle=`rgba(${C.bone},${0.3+k*0.6})`; ctx.lineWidth=k>=1?3.4:1.6;
    if(k<1) ctx.setLineDash([7,6]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=`rgba(${C.bone},0.85)`; ctx.font='500 11px "IBM Plex Mono", monospace'; ctx.textAlign='center';
    ctx.fillText(t(k>=1?'hold_low':'hold_high'), S.hold.x, S.hold.y-34);
  }
  for(const n of G.targets){
    const x=n.x, y=n.y, RR=n.boss?R*1.6:R;
    const split=SPLIT.includes(S.mode);
    const litCol = split ? (n.owner===2?C.p2:C.saffron) : C.saffron;
    if(S.mode==='melody' && !n.lit && n.seq===S.expect && S.phase==='play'){
      const k=reduce?0.5:(Math.sin(tt*4)+1)/2; ctx.beginPath(); ctx.arc(x,y,RR+9+k*4,0,TAU); ctx.strokeStyle=`rgba(${C.saffron},${0.25+k*0.35})`; ctx.lineWidth=1.5; ctx.stroke();
    }
    if(n.frozenUntil && tt<n.frozenUntil){
      ctx.beginPath(); ctx.arc(x,y,RR+8,0,TAU); ctx.strokeStyle=`rgba(${C.p2},0.85)`; ctx.lineWidth=2; ctx.setLineDash([2,3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(x,y,RR+8,-Math.PI/2,-Math.PI/2+(n.frozenUntil-tt)/3*TAU); ctx.strokeStyle=`rgba(${C.p2},0.9)`; ctx.lineWidth=3; ctx.stroke();
    }
    if(n.expire && !n.lit){ const left=Math.max(0,(n.expire-tt)/(S.rh?S.rh.beat*6:5)); ctx.beginPath(); ctx.arc(x,y,RR+6,-Math.PI/2,-Math.PI/2+left*TAU); ctx.strokeStyle=`rgba(${left<0.3?C.rose:C.dust},0.8)`; ctx.lineWidth=2; ctx.stroke(); }
    if(n.lit){
      const k=tt-n.litT;
      if(!reduce && k<0.8){ ctx.beginPath(); ctx.arc(x,y,RR+k*60,0,TAU); ctx.strokeStyle=`rgba(${litCol},${0.6*(1-k/0.8)})`; ctx.lineWidth=2; ctx.stroke(); }
      const pulse=reduce?0:Math.sin(tt*3+n.nx*9)*1.5;
      ctx.save(); ctx.shadowColor=`rgba(${litCol},0.8)`; ctx.shadowBlur=24;
      ctx.beginPath(); ctx.arc(x,y,RR*0.72+pulse,0,TAU); ctx.fillStyle=`rgb(${litCol})`; ctx.fill(); ctx.restore();
      if(n.fragile){ ctx.setLineDash([3,4]); ctx.beginPath(); ctx.arc(x,y,RR+3,0,TAU); ctx.strokeStyle=`rgba(${C.rose},0.9)`; ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]); }
      if(n.decay){ const left=Math.max(0,1-(tt-n.litT)/n.decay); ctx.beginPath(); ctx.arc(x,y,RR+5,-Math.PI/2,-Math.PI/2+left*TAU); ctx.strokeStyle=`rgba(${C.rose},0.95)`; ctx.lineWidth=2.5; ctx.stroke(); }
      if(split && SET.cb) label(String(n.owner||''),x,y+1,C.ink,11);
    } else {
      const armed=n.armedT!=null, gap=n.need>=4?0.22:0.32, seg=TAU/n.need;
      for(let i=0;i<n.need;i++){
        const a0=-Math.PI/2+i*seg+gap/2; ctx.beginPath(); ctx.arc(x,y,RR,a0,a0+seg-gap);
        const on=armed||i<n.dirs, blink=armed&&!reduce&&Math.sin(tt*30)>0;
        let base=C.bone;
        if(n.chroma) base = i%2===0?C.rose:C.p2;
        if(n.coop) base = i%2===0?C.saffron:C.p2;
        ctx.strokeStyle= on ? `rgba(${C.saffron},${blink?0.5:1})` : `rgba(${base},${n.chroma||n.coop?0.8:0.55})`; ctx.lineWidth=on?3.5:(n.boss?3:2); ctx.stroke();
      }
      if(n.boss){ ctx.beginPath(); ctx.arc(x,y,RR+7,0,TAU); ctx.strokeStyle=`rgba(${C.rose},0.5)`; ctx.lineWidth=1; ctx.stroke(); }
      if(n.fragile){ ctx.setLineDash([3,4]); ctx.beginPath(); ctx.arc(x,y,RR+6,0,TAU); ctx.strokeStyle=`rgba(${C.rose},0.8)`; ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]); }
      if(n.decay){ ctx.beginPath(); ctx.arc(x,y,RR+6,0,TAU); ctx.strokeStyle=`rgba(${C.rose},0.45)`; ctx.lineWidth=1; ctx.stroke(); }
    }
    const ic = n.lit ? C.ink : C.bone;
    ctx.fillStyle=`rgba(${ic},0.9)`; ctx.strokeStyle=`rgba(${ic},0.9)`; ctx.lineWidth=2;
    if(n.lit && split && SET.cb){}
    else if(n.seq!=null) label(String(n.seq+1),x,y+1,ic,12);
    else if(n.chroma && !n.lit) label('A·B',x,y+1,C.bone,8);
    else if(n.coop && !n.lit) label('1·2',x,y+1,C.bone,8);
    else if(n.boss && !n.lit) label('4',x,y+1,C.rose,13);
    else if(n.battery){ ctx.beginPath(); ctx.moveTo(x-5,y); ctx.lineTo(x+5,y); ctx.moveTo(x,y-5); ctx.lineTo(x,y+5); ctx.stroke(); }
    else if(n.freq==='low'){ ctx.fillRect(x-4,y-4,8,8); }
    else if(n.freq==='high'){ ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x+5,y+4); ctx.lineTo(x-5,y+4); ctx.closePath(); ctx.stroke(); }
    else if(n.decay){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-5); ctx.moveTo(x,y); ctx.lineTo(x+4,y); ctx.stroke(); }
    else if(!n.lit){ ctx.beginPath(); ctx.arc(x,y,3,0,TAU); ctx.fill(); }
    for(const h of n.hits){
      const k=1-(tt-h.t)/G.win; if(k<=0) continue;
      const col = split ? (h.owner===2?C.p2:C.saffron) : (h.hue!=null&&chromaLvl) ? (h.hue===0?C.rose:C.p2) : h.kind==='chain'?C.saffron : h.kind==='prism'?C.rose : C.bone;
      ctx.beginPath(); ctx.moveTo(x+Math.cos(h.a)*(RR+4),y+Math.sin(h.a)*(RR+4)); ctx.lineTo(x+Math.cos(h.a)*(RR+4+18*k),y+Math.sin(h.a)*(RR+4+18*k));
      ctx.strokeStyle=`rgba(${col},${k})`; ctx.lineWidth=2.5; ctx.stroke();
    }
  }
}
let demoRings=[], demoT=0, demoNext=0;
function drawDemo(dt){
  demoT+=dt; ctx.drawImage(grid,0,0,W,H); if(reduce) return;
  if(demoT>demoNext){ demoRings.push({x:(0.2+Math.random()*0.6)*W,y:(0.1+Math.random()*0.4)*H,b:demoT,c:[C.bone,C.saffron,C.rose][Math.floor(Math.random()*3)]}); demoNext=demoT+0.9; }
  demoRings=demoRings.filter(r=>demoT-r.b<5);
  for(const r of demoRings){ const a=Math.max(0,1-(demoT-r.b)/5); ctx.beginPath(); ctx.arc(r.x,r.y,(demoT-r.b)*M*0.25,0,TAU); ctx.strokeStyle=`rgba(${r.c},${a*0.5})`; ctx.lineWidth=1.4; ctx.stroke(); }
}

/* ---------- boucle ---------- */
let last=performance.now();
function frame(nowT){
  const dt=Math.min((nowT-last)/1000,0.05); last=nowT;
  if(S.phase==='menu'||!G){ drawDemo(dt); requestAnimationFrame(frame); return; }
  if(S.mode==='editor'){ draw(); requestAnimationFrame(frame); return; }
  if(S.phase==='play'){ STATS.playSec+=dt; if(++statsDirty>600) saveStats(); }
  S.acc+=dt*(S.mode==='replay'?2:1);
  let guard=0;
  while(S.acc>=STEP && guard++<40){
    S.acc-=STEP;
    if(S.phase==='over') continue;
    if(S.mode==='replay' && S.phase==='play'){
      const taps=S.replay.runs[S.level-1]||[];
      for(const tp of taps){ if(tp.done || tp.s>G.stepN) continue; tp.done=true;
        if(tp.b!=null){ const b=G.beacons[tp.b]; if(b){ if(tp.on){ if(S.pulses>0) S.pulses--; b.active=true; b.next=G.t; } else b.active=false; } continue; }
        const x=G.env.x0+tp.nx*G.env.w, y=G.env.y0+tp.ny*G.env.h;
        if(tp.z){ S.freezes--; } else if(S.pulses>0) S.pulses--;
        E.tap(G,x,y,0,tp.f||null,{freeze:!!tp.z}); S.marks.push({x,y,t:G.t}); tone(SCALE[0]*0.5,0.2,'triangle',0.04); renderHud(); }
      if(taps.every(tp=>tp.done)) S.pulses=0;
    }
    E.step(G,STEP,onEvent);
    if(S.phase==='play') checkState();
    else if(S.phase==='clear'||S.phase==='retry') afterClear();
    if(!G) break;
  }
  if(G){ if(S.mode==='chrono'&&S.phase==='play') $('lvl').textContent=Math.ceil(S.timeLeft); draw(); }
  else drawDemo(dt);
  requestAnimationFrame(frame);
}
addEventListener('pagehide',saveStats);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveStats(); else if(S.phase==='menu') refreshMenu(); });

buildLangSeg(); bindSettings(); applyLang();
applyTheme(store.get('resonance.theme','seiche'));
if(+store.get('resonance.total',0) < TH.need) applyTheme('seiche');
addEventListener('resize',resize); resize();
refreshMenu();
// bouton retour d'Android : ferme l'écran ouvert, sinon revient au menu ; renvoie false au menu pour quitter
window.resonanceBack=()=>{
  for(const id of ['statsView','setView']) if(!$(id).hidden){ $(id).hidden=true; return true; }
  if(!$('campView').hidden){ toMenu(); return true; }
  if(S.phase==='menu' && !$('menu').hidden) return false;
  toMenu(); return true;
};
const sp=$('splash');
const leave=()=>{ if(sp.classList.contains('hide')) return; sp.classList.add('hide'); $('menu').hidden=false; setTimeout(()=>{ sp.hidden=true; }, reduce?0:500); };
sp.addEventListener('pointerdown',()=>{ startAudio(); leave(); });
setTimeout(leave, reduce?200:1600);
requestAnimationFrame(frame);
})();
</script>

if('serviceWorker' in navigator){ addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
