<noscript><p style="padding:24px;font:16px/1.5 system-ui,sans-serif">Résonance est un jeu de réflexion gratuit : croise deux ondes au même instant pour allumer les nœuds. Jeu d'ondes tactile, jouable hors ligne sur mobile et dans le navigateur. Active JavaScript pour jouer.</p></noscript>

<main>
<canvas id="c" data-ia="a_canvas"></canvas>

<div class="hud" id="hud" hidden>
  <div class="l">
    <button class="menubtn" id="toMenu" data-ia="a_menu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/></svg></button>
    <div><span id="lvlLabel"></span><b id="lvl">1</b></div>
  </div>
  <div class="pulses" id="pulses" data-ia="a_pulses"></div>
  <div class="r"><span id="scoreLabel"></span><b id="score">0</b></div>
</div>
<button class="freezebtn" id="freezeBtn" hidden data-ia="a_freeze"><span data-i="freeze"></span><b id="freezeN">0</b></button>

<div class="duel top" id="duelTop" hidden><span data-i="p2"></span><b id="d2">0</b><div class="pulses" id="dp2"></div></div>
<div class="duel bot" id="duelBot" hidden>
  <button class="menubtn" id="toMenu2" data-ia="a_menu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/></svg></button>
  <span data-i="p1"></span><b id="d1">0</b><div class="pulses" id="dp1"></div>
</div>

<div class="edtop" id="edTop" hidden>

  <div class="grow"><span data-i="ed_title"></span><b id="edCount"></b></div>
  <div class="stepper" data-ia="a_pulses_ed"><button id="pMinus" data-ia="a_minus">−</button><span id="pVal">3</span><button id="pPlus" data-ia="a_plus">+</button></div>
  <button class="btn small" id="edTest" data-i="ed_test"></button>
  <button class="btn small ghost" id="edCode" data-i="ed_code"></button>

    <button class="mode" id="mTuto"><strong data-i="m_tuto"></strong><small id="tutoLine"></small></button>

    <button class="mode" id="mRhythm"><strong data-i="m_rhythm"></strong><small><span data-i="record"></span> <b id="bestRhythm">0</b></small></button>
    <button class="mode" id="mMelody"><strong data-i="m_melody"></strong><small><span data-i="record"></span> <b id="bestMelody">0</b></small></button>
    <button class="mode" id="mCoop"><strong data-i="m_coop"></strong><small><span data-i="level"></span> <b id="bestCoop">0</b></small></button>
    <button class="mode" id="mDuel"><strong data-i="m_duel"></strong><small data-i="duel_sub"></small></button>
    <button class="mode" id="mZen"><strong data-i="m_zen"></strong><small><span data-i="nodes"></span> <b id="zenCount">0</b></small></button>
    <button class="mode" id="mEditor"><strong data-i="m_editor"></strong><small data-i="editor_sub"></small></button>

  </div>

  </div>
</div>

<div class="overlay solid" id="setView" hidden>

  <div class="setrow"><div><span data-i="set_speed"></span><small data-i="set_speed_note"></small></div>
    <div class="seg" data-k="speed"><button data-v="0.8" data-i="slow"></button><button data-v="1" data-i="normal"></button><button data-v="1.2" data-i="fast"></button></div></div>
  <div class="setrow"><div><span data-i="set_cb"></span><small data-i="set_cb_note"></small></div>
    <div class="seg" data-k="cb"><button data-v="1" data-i="on"></button><button data-v="0" data-i="off"></button></div></div>
  <p class="legal"><a href="privacy.html" data-i="legal"></a></p>
  <div class="row"><button class="btn" id="closeSet" data-i="back"></button></div>
</div>

<div class="overlay solid" id="statsView" hidden>
  <div class="kicker" data-i="stats_kicker"></div>
  <h2 class="big" style="font-size:clamp(34px,10vw,60px)" data-i="stats_title"></h2>
  <div class="stats" id="statsGrid"></div>
  <h2 id="achHead"></h2>
  <ul class="ach" id="achList"></ul>
  <div class="row"><button class="btn" id="closeStats" data-i="back"></button></div>
</div>

<div class="overlay" id="end" hidden>
  <div class="kicker" id="endKicker"></div>
  <h2 class="big" id="endTitle" style="font-size:clamp(36px,11vw,64px)"></h2>
  <p id="endMsg"></p>
  <p id="endExtra" class="end-extra" hidden></p>

  <p id="shareStatus" class="sr-status" role="status" aria-live="polite"></p>
  <div class="row" id="endBtns"></div>
</div>

<div class="splash" id="splash" role="button" data-ia="a_splash">
  <div class="sp-stage"><i></i><i></i><i></i><div class="sp-title">Réso<em>nance</em></div></div>
</div>
